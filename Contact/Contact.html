<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="Contact.css">
</head>
<body>
    <main class="contact-page">
        <section class="contact-card">
            <h1>Contact Us</h1>
            <p class="lead">Have a question or want to work together? Send us a message.</p>
            <form id="contactForm" novalidate>
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required autocomplete="name" />
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" />
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="field">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" />
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="actions">
                    <button type="submit" id="submitBtn">Send Message</button>
                </div>
            </form>
            <div id="successMessage" class="success" hidden>Thanks — your message has been sent.</div>
        </section>
    </main>

        <footer>
        <div class="footer-top">
            <div class="footer-brand">
                <span class="footer-logo">Anther Link</span>
                <p>Building the connections that matter.</p>
            </div>

            <div class="footer-links">
                <div class="footer-col">
                    <span class="footer-heading">Company</span>
                    <a href="#">About</a>
                    <a href="Contact.html" target="_blank">Contact</a>
                </div>
                <div class="footer-col">
                    <span class="footer-heading">Follow</span>
                    <a href="https://x.com/AntherLink" target="_blank">Twitter / X</a>
                    <a href="#">LinkedIn</a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 Anther Link. All rights reserved.</p>
        </div>
    </footer>

    <script src="contact.js"></script>
</body>
</html>
