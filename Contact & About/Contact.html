<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Anther Link</title>

        <meta name="description" content="Helping ambitious businesses grow through AI automation, full-stack development, and modern web design. We build fast, scalable digital experiences designed for growth.">

    <meta property="og:title" content="Anther Link">
    <meta property="og:description" content="Helping ambitious businesses grow through AI, web development and design.">
    <meta property="og:image" content="https://anther-link.vercel.app/images/preview.png">
    <meta property="og:url" content="https://anther-link.vercel.app/">
    <meta property="og:type" content="website">

    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="Contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <nav>
            <a href="../index.html" class="logo">
                <img src="../images/logo-combined.svg" alt="AntherLink logo" class="logo-img">
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Home</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-card">
            <h1>Contact Us</h1>
            <p class="lead">Have a question or want to work together? Send us a message.</p>
            <form id="contactForm" novalidate>
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required autocomplete="name" />
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" />
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="field">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" />
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                    <div class="error" aria-live="polite"></div>
                </div>

                <div class="actions">
                    <button type="submit" id="submitBtn">Send Message</button>
                </div>
            </form>
            <div id="successMessage" class="success" hidden>Thanks — your message has been sent.</div>
        </section>
    </main>

    <script src="contact.js"></script>
    <script src="nav.js"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>

</html>
